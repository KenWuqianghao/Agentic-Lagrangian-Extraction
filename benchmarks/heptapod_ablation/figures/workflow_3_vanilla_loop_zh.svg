<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 470" width="1300" height="470" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a97a8"/></marker></defs><rect width="1300" height="470" fill="#0f1318"/><text x="40" y="40" font-size="22" fill="#e6ebf1" text-anchor="start" font-weight="700">vanilla：agent 的工作循环</text><rect x="40" y="120" width="230" height="80" rx="9" fill="#3a2618" stroke="#e0864a" stroke-width="2"/><text x="155.0" y="155.8" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">读论文和 SM.fr</text><text x="155.0" y="176.12500000000003" font-size="14" fill="#a3b1c2" text-anchor="middle">LaTeX 源文件</text><rect x="310" y="120" width="230" height="80" rx="9" fill="#3a2618" stroke="#e0864a" stroke-width="2"/><text x="425.0" y="155.8" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">写 model.fr</text><text x="425.0" y="176.12500000000003" font-size="14" fill="#a3b1c2" text-anchor="middle">自己决定怎么写</text><rect x="580" y="110" width="330" height="100" rx="9" fill="#3a2618" stroke="#e0864a" stroke-width="2"/><text x="745.0" y="145.65" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">自己运行检查</text><text x="745.0" y="165.97500000000002" font-size="14" fill="#a3b1c2" text-anchor="middle">自己写 wolframscript 脚本，</text><text x="745.0" y="186.27500000000003" font-size="14" fill="#a3b1c2" text-anchor="middle">跑 FeynRules 的检查；有时跑 MadGraph</text><polygon points="1085,108 1220,160 1085,212 950,160" fill="#3a2618" stroke="#e0864a" stroke-width="2"/><text x="1085" y="155.125" font-size="15" fill="#e6ebf1" text-anchor="middle" font-weight="700">自己觉得</text><text x="1085" y="175.375" font-size="15" fill="#e6ebf1" text-anchor="middle" font-weight="700">通过了？</text><path d="M270,160 L310,160" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M540,160 L580,160" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M910,160 L950,160" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M1085,108 L1085,80 L425,80 L425,120" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="715.25" y="68.525" width="79.5" height="21.6" rx="4" fill="#0f1318"/><text x="755" y="84.05" font-size="13.5" fill="#e6ebf1" text-anchor="middle">否：自己改</text><rect x="985" y="250" width="200" height="56" rx="9" fill="#1d2530" stroke="#4a5668" stroke-width="2"/><text x="1085.0" y="283.25" font-size="15" fill="#e6ebf1" text-anchor="middle" font-weight="700">结束：交付 model.fr</text><path d="M1085,212 L1085,250" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="1094.25" y="219.525" width="25.5" height="21.6" rx="4" fill="#0f1318"/><text x="1107" y="235.04999999999998" font-size="13.5" fill="#e6ebf1" text-anchor="middle">是</text><rect x="40" y="250" width="870" height="190" rx="9" fill="#1d2530" stroke="#4a5668" stroke-width="2"/><text x="56" y="299.85" font-size="16" fill="#e6ebf1" text-anchor="start" font-weight="700">和工具组的区别</text><text x="56" y="319.87500000000006" font-size="14" fill="#a3b1c2" text-anchor="start">• 没有 lint、诊断报告、massbasis、审查 agent。</text><text x="56" y="340.17500000000007" font-size="14" fill="#a3b1c2" text-anchor="start">• 没有结束门：agent 自己判断模型是否通过。</text><text x="56" y="360.4750000000001" font-size="14" fill="#a3b1c2" text-anchor="start">• 它的判断可能错：Wprime s2（Sonnet 5）的总结写「全部通过」，</text><text x="56" y="380.7750000000001" font-size="14" fill="#a3b1c2" text-anchor="start">  评分器的质量谱检查失败，分数是 0。</text><text x="56" y="401.0750000000001" font-size="14" fill="#a3b1c2" text-anchor="start">• 它读很长的日志、反复试错，所以成本是工具组的 2.7 到 3.8 倍。</text></svg>
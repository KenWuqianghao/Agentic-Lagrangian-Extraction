<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 580" width="1300" height="580" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a97a8"/></marker></defs><rect width="1300" height="580" fill="#0f1318"/><text x="40" y="40" font-size="22" fill="#e6ebf1" text-anchor="start" font-weight="700">整个实验：一次运行从论文到分数</text><rect x="40" y="80" width="260" height="74" rx="9" fill="#1d2530" stroke="#4a5668" stroke-width="2"/><text x="170.0" y="112.8" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">13 篇论文</text><text x="170.0" y="133.125" font-size="14" fill="#a3b1c2" text-anchor="middle">LaTeX 源文件</text><rect x="40" y="172" width="260" height="74" rx="9" fill="#1d2530" stroke="#4a5668" stroke-width="2"/><text x="170.0" y="204.8" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">3 个模型</text><text x="170.0" y="225.12500000000003" font-size="14" fill="#a3b1c2" text-anchor="middle">Sonnet 5 · Haiku 5.5 · Sonnet 5.5</text><rect x="40" y="264" width="260" height="74" rx="9" fill="#1d2530" stroke="#4a5668" stroke-width="2"/><text x="170.0" y="296.8" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">1 到 3 个 seed</text><text x="170.0" y="317.12500000000006" font-size="14" fill="#a3b1c2" text-anchor="middle">同一个任务，重复运行</text><path d="M300,209 L330,209 L330,137 L370,137" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M330,209 L330,282 L370,282" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="324.0" y="159.25" width="20.0" height="99.5" rx="4" fill="#0f1318"/><text x="334" y="213.375" font-size="12.5" fill="#e6ebf1" text-anchor="middle" transform="rotate(-90 334 213.375)">同一个任务文字</text><rect x="370" y="80" width="400" height="114" rx="9" fill="#1d3e2d" stroke="#4fc48a" stroke-width="2"/><text x="570.0" y="122.65" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">工具组</text><text x="570.0" y="142.97500000000002" font-size="14" fill="#a3b1c2" text-anchor="middle">Claude Code + heptapod 工具（MCP）</text><text x="570.0" y="163.27500000000003" font-size="14" fill="#a3b1c2" text-anchor="middle">+ 协议 + 结束门 + 命令行</text><rect x="370" y="225" width="400" height="114" rx="9" fill="#3a2618" stroke="#e0864a" stroke-width="2"/><text x="570.0" y="257.5" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">vanilla</text><text x="570.0" y="277.82500000000005" font-size="14" fill="#a3b1c2" text-anchor="middle">Claude Code + 命令行</text><text x="570.0" y="298.12500000000006" font-size="14" fill="#a3b1c2" text-anchor="middle">自己运行 FeynRules 和 MadGraph，</text><text x="570.0" y="318.42500000000007" font-size="14" fill="#a3b1c2" text-anchor="middle">自己决定什么时候结束</text><rect x="370" y="362" width="400" height="96" rx="9" fill="#1d2530" stroke="#4a5668" stroke-width="2" stroke-dasharray="6 5"/><text x="570.0" y="396.4" font-size="15" fill="#e6ebf1" text-anchor="middle" font-weight="700">两组相同</text><text x="570.0" y="415.0375" font-size="13" fill="#a3b1c2" text-anchor="middle">FeynRules 2.3.49 · MadGraph 3.7.3 · 4 小时时限</text><text x="570.0" y="433.88750000000005" font-size="13" fill="#a3b1c2" text-anchor="middle">每台机器 2 个内核、2 个 agent · 沙箱 · 不能上网</text><rect x="815" y="172" width="130" height="74" rx="9" fill="#1d2530" stroke="#4a5668" stroke-width="2"/><text x="880.0" y="205.5375" font-size="16" fill="#e6ebf1" text-anchor="middle" font-weight="700">model.fr</text><text x="880.0" y="223.93125" font-size="12.5" fill="#a3b1c2" text-anchor="middle">交付的文件</text><path d="M770,137 L790,137 L790,196 L815,196" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M770,282 L790,282 L790,222 L815,222" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M945,209 L985,209" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="985" y="80" width="285" height="270" rx="9" fill="#1d2530" stroke="#4a5668" stroke-width="2"/><text x="1127" y="110" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">同一个评分器</text><rect x="1000" y="126" width="255" height="112" rx="9" fill="#3a3016" stroke="#e7b84b" stroke-width="2"/><text x="1127.5" y="160.0625" font-size="15" fill="#e6ebf1" text-anchor="middle" font-weight="700">① 门：6 项检查</text><text x="1127.5" y="178.15625" font-size="12.5" fill="#a3b1c2" text-anchor="middle">编译 · 厄米性 · 动能项</text><text x="1127.5" y="196.28125" font-size="12.5" fill="#a3b1c2" text-anchor="middle">质量项 · 质量谱 · MadGraph 导入</text><text x="1127.5" y="214.40625" font-size="12.5" fill="#a3b1c2" text-anchor="middle">一项失败 → 0 分</text><rect x="1000" y="250" width="255" height="88" rx="9" fill="#261f3d" stroke="#a98bf0" stroke-width="2"/><text x="1127.5" y="281.125" font-size="15" fill="#e6ebf1" text-anchor="middle" font-weight="700">② 顶点种类 F1</text><text x="1127.5" y="299.21875" font-size="12.5" fill="#a3b1c2" text-anchor="middle">和 FeynRules 数据库里</text><text x="1127.5" y="317.34375" font-size="12.5" fill="#a3b1c2" text-anchor="middle">同一篇论文的参考模型比</text><path d="M1127,350 L1127,380" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="985" y="380" width="285" height="175" rx="9" fill="#1d2530" stroke="#4a5668" stroke-width="2"/><text x="1127.5" y="435.4" font-size="16" fill="#e6ebf1" text-anchor="middle" font-weight="700">统计</text><text x="1127.5" y="454.33750000000003" font-size="13" fill="#a3b1c2" text-anchor="middle">每次运行 → 每篇论文一个分数</text><text x="1127.5" y="473.18750000000006" font-size="13" fill="#a3b1c2" text-anchor="middle">每篇论文：对 seed 求平均</text><text x="1127.5" y="492.0375000000001" font-size="13" fill="#a3b1c2" text-anchor="middle">工具组 − vanilla，13 篇配对</text><text x="1127.5" y="510.88750000000005" font-size="13" fill="#a3b1c2" text-anchor="middle">配对置换检验</text><text x="1127" y="543" font-size="15" fill="#4fc48a" text-anchor="middle" font-weight="700">三个模型合并：+0.14，p = 0.004</text><text x="40" y="520" font-size="14" fill="#a3b1c2" text-anchor="start">一次运行 = 一个模型 × 一篇论文 × 一个组 × 一个 seed。这次共 182 次。</text><text x="40" y="548" font-size="14" fill="#a3b1c2" text-anchor="start">图 2 是工具组的循环，图 3 是 vanilla 的循环。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1040" width="1300" height="1040" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a97a8"/></marker></defs><rect width="1300" height="1040" fill="#0f1318"/><text x="40" y="40" font-size="22" fill="#e6ebf1" text-anchor="start" font-weight="700">工具组：agent 的工作循环</text><rect x="560" y="28" width="16" height="16" rx="3" fill="#16283a" stroke="#5aa9e6" stroke-width="2"/><text x="582" y="41" font-size="13.5" fill="#a3b1c2" text-anchor="start">agent 的动作</text><rect x="689.86" y="28" width="16" height="16" rx="3" fill="#261f3d" stroke="#a98bf0" stroke-width="2"/><text x="711.86" y="41" font-size="13.5" fill="#a3b1c2" text-anchor="start">heptapod 工具</text><rect x="828.9000000000001" y="28" width="16" height="16" rx="3" fill="#3a3016" stroke="#e7b84b" stroke-width="2"/><text x="850.9000000000001" y="41" font-size="13.5" fill="#a3b1c2" text-anchor="start">harness 的结束门</text><rect x="987.3800000000001" y="28" width="16" height="16" rx="3" fill="#1d3e2d" stroke="#4fc48a" stroke-width="2"/><text x="1009.3800000000001" y="41" font-size="13.5" fill="#a3b1c2" text-anchor="start">结果</text><rect x="60" y="70" width="420" height="62" rx="9" fill="#16283a" stroke="#5aa9e6" stroke-width="2"/><text x="270.0" y="96.8" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">读论文和 SM.fr</text><text x="270.0" y="117.12499999999999" font-size="14" fill="#a3b1c2" text-anchor="middle">LaTeX 源文件；SM 的名字不能猜</text><rect x="60" y="160" width="420" height="62" rx="9" fill="#16283a" stroke="#5aa9e6" stroke-width="2"/><text x="270.0" y="186.8" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">写自检表，再写 model.fr</text><text x="270.0" y="207.12500000000003" font-size="14" fill="#a3b1c2" text-anchor="middle">FeynRules add-on，加载在 SM.fr 上</text><rect x="60" y="250" width="420" height="62" rx="9" fill="#261f3d" stroke="#a98bf0" stroke-width="2"/><text x="270.0" y="276.8" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">lint_model</text><text x="270.0" y="297.12500000000006" font-size="14" fill="#a3b1c2" text-anchor="middle">固定规则的检查，毫秒级</text><rect x="60" y="340" width="420" height="100" rx="9" fill="#261f3d" stroke="#a98bf0" stroke-width="2"/><text x="270.0" y="375.65" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">validate_model（预算 10 次）</text><text x="270.0" y="395.975" font-size="14" fill="#a3b1c2" text-anchor="middle">跑完整检查链，返回到达的阶段和诊断</text><text x="270.0" y="416.27500000000003" font-size="14" fill="#a3b1c2" text-anchor="middle">compile → checks → mg5 → pass</text><polygon points="270,466 352,500 270,534 188,500" fill="#1d2530" stroke="#4a5668" stroke-width="2"/><text x="270" y="505.25" font-size="15" fill="#e6ebf1" text-anchor="middle" font-weight="700">通过？</text><rect x="60" y="565" width="420" height="70" rx="9" fill="#261f3d" stroke="#a98bf0" stroke-width="2"/><text x="270.0" y="595.8" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">review_model（预算 2 次）</text><text x="270.0" y="616.1249999999999" font-size="14" fill="#a3b1c2" text-anchor="middle">另一个 agent 对照论文审查模型</text><rect x="60" y="665" width="420" height="50" rx="9" fill="#16283a" stroke="#5aa9e6" stroke-width="2"/><text x="270.0" y="695.95" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">agent 想结束</text><rect x="60" y="745" width="420" height="150" rx="9" fill="#3a3016" stroke="#e7b84b" stroke-width="2"/><text x="76" y="785.35" font-size="17" fill="#e6ebf1" text-anchor="start" font-weight="700">结束门（Stop hook）</text><text x="76" y="805.675" font-size="14" fill="#a3b1c2" text-anchor="start">① model.fr 存在</text><text x="76" y="825.9749999999999" font-size="14" fill="#a3b1c2" text-anchor="start">② 运行过 validate_model</text><text x="76" y="846.2749999999999" font-size="14" fill="#a3b1c2" text-anchor="start">③ 最后一次验证通过</text><text x="76" y="866.5749999999998" font-size="14" fill="#a3b1c2" text-anchor="start">④ 之后 model.fr 没有改过</text><rect x="60" y="940" width="420" height="56" rx="9" fill="#1d3e2d" stroke="#4fc48a" stroke-width="2"/><text x="270.0" y="973.95" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">结束：交付 model.fr</text><path d="M270,132 L270,160" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M270,222 L270,250" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M270,312 L270,340" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M270,440 L270,466" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M270,635 L270,665" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M270,715 L270,745" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M270,534 L270,565" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="279.25" y="538.525" width="25.5" height="21.6" rx="4" fill="#0f1318"/><text x="292" y="554.0500000000001" font-size="13.5" fill="#e6ebf1" text-anchor="middle">是</text><path d="M270,895 L270,940" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="230.25" y="905.525" width="79.5" height="21.6" rx="4" fill="#0f1318"/><text x="270" y="921.0500000000001" font-size="13.5" fill="#e6ebf1" text-anchor="middle">四项都满足</text><rect x="650" y="160" width="460" height="62" rx="9" fill="#261f3d" stroke="#a98bf0" stroke-width="2" stroke-dasharray="6 5"/><text x="880.0" y="186.8" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">massbasis（有标量混合时）</text><text x="880.0" y="207.12500000000003" font-size="14" fill="#a3b1c2" text-anchor="middle">用 sympy 推导质量基，约 1 秒</text><path d="M650,191 L480,191" fill="none" stroke="#8a97a8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="650" y="440" width="460" height="120" rx="9" fill="#16283a" stroke="#5aa9e6" stroke-width="2"/><text x="880.0" y="476.5875" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">读报告，改 model.fr</text><text x="880.0" y="496.36875" font-size="13.5" fill="#a3b1c2" text-anchor="middle">报告：到达的阶段、每项检查的结论、</text><text x="880.0" y="515.94375" font-size="13.5" fill="#a3b1c2" text-anchor="middle">非厄米顶点、质量矩阵、MadGraph 回溯</text><text x="880.0" y="535.5187500000001" font-size="13.5" fill="#a3b1c2" text-anchor="middle">命令行：读自己的 UFO 和日志，跑 wolframscript</text><path d="M352,500 L650,500" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="487.25" y="488.525" width="25.5" height="21.6" rx="4" fill="#0f1318"/><text x="500" y="504.05" font-size="13.5" fill="#e6ebf1" text-anchor="middle">否</text><path d="M880,440 L880,281 L480,281" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="821.35" y="348.525" width="117.3" height="21.6" rx="4" fill="#0f1318"/><text x="880" y="364.05" font-size="13.5" fill="#e6ebf1" text-anchor="middle">再 lint，再验证</text><path d="M480,600 L770,600 L770,560" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="553.25" y="588.525" width="133.5" height="21.6" rx="4" fill="#0f1318"/><text x="620" y="604.0500000000001" font-size="13.5" fill="#e6ebf1" text-anchor="middle">发现改了物理的差异</text><path d="M480,820 L690,820" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="538.5" y="808.525" width="93.0" height="21.6" rx="4" fill="#0f1318"/><text x="585" y="824.0500000000001" font-size="13.5" fill="#e6ebf1" text-anchor="middle">有一项不满足</text><polygon points="880,758 1070,820 880,882 690,820" fill="#3a3016" stroke="#e7b84b" stroke-width="2"/><text x="880" y="815.2875" font-size="14.5" fill="#e6ebf1" text-anchor="middle" font-weight="700">已经拦了不到 3 次</text><text x="880" y="834.8625000000001" font-size="14.5" fill="#e6ebf1" text-anchor="middle" font-weight="700">而且验证不到 10 次？</text><path d="M1070,820 L1210,820 L1210,500 L1110,500" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="1199.2" y="579.75" width="21.6" height="160.5" rx="4" fill="#0f1318"/><text x="1210" y="664.725" font-size="13.5" fill="#e6ebf1" text-anchor="middle" transform="rotate(-90 1210 664.725)">是：拦回，附上报告摘要</text><rect x="650" y="940" width="460" height="56" rx="9" fill="#4a2423" stroke="#e5645f" stroke-width="2"/><text x="880.0" y="973.95" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">放行：带着失败的模型结束</text><path d="M880,882 L880,940" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="889.25" y="898.525" width="25.5" height="21.6" rx="4" fill="#0f1318"/><text x="902" y="914.0500000000001" font-size="13.5" fill="#e6ebf1" text-anchor="middle">否</text><text x="880" y="1022" font-size="13.5" fill="#a3b1c2" text-anchor="middle">Haiku 工具组的 5 次 0 分都从这里结束。</text><text x="60" y="1022" font-size="13.5" fill="#a3b1c2" text-anchor="start">整个循环有 4 小时时限。</text></svg>
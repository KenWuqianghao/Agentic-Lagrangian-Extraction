<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1040" width="1300" height="1040" font-family='"Noto Sans","Segoe UI",Helvetica,Arial,sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a97a8"/></marker></defs><rect width="1300" height="1040" fill="#0f1318"/><text x="40" y="40" font-size="22" fill="#e6ebf1" text-anchor="start" font-weight="700">Tools group: the agent&#x27;s work loop</text><rect x="560" y="28" width="16" height="16" rx="3" fill="#16283a" stroke="#5aa9e6" stroke-width="2"/><text x="582" y="41" font-size="13.5" fill="#a3b1c2" text-anchor="start">agent action</text><rect x="694.72" y="28" width="16" height="16" rx="3" fill="#261f3d" stroke="#a98bf0" stroke-width="2"/><text x="716.72" y="41" font-size="13.5" fill="#a3b1c2" text-anchor="start">heptapod tool</text><rect x="837.0" y="28" width="16" height="16" rx="3" fill="#3a3016" stroke="#e7b84b" stroke-width="2"/><text x="859.0" y="41" font-size="13.5" fill="#a3b1c2" text-anchor="start">harness stop gate</text><rect x="1009.52" y="28" width="16" height="16" rx="3" fill="#1d3e2d" stroke="#4fc48a" stroke-width="2"/><text x="1031.52" y="41" font-size="13.5" fill="#a3b1c2" text-anchor="start">result</text><rect x="60" y="70" width="420" height="62" rx="9" fill="#16283a" stroke="#5aa9e6" stroke-width="2"/><text x="270.0" y="96.8" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">Read the paper and SM.fr</text><text x="270.0" y="117.12499999999999" font-size="14" fill="#a3b1c2" text-anchor="middle">LaTeX source; never guess SM names</text><rect x="60" y="160" width="420" height="62" rx="9" fill="#16283a" stroke="#5aa9e6" stroke-width="2"/><text x="270.0" y="186.8" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">Write a self-audit table, then model.fr</text><text x="270.0" y="207.12500000000003" font-size="14" fill="#a3b1c2" text-anchor="middle">A FeynRules add-on, loaded on top of SM.fr</text><rect x="60" y="250" width="420" height="62" rx="9" fill="#261f3d" stroke="#a98bf0" stroke-width="2"/><text x="270.0" y="276.8" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">lint_model</text><text x="270.0" y="297.12500000000006" font-size="14" fill="#a3b1c2" text-anchor="middle">Fixed-rule checks, milliseconds</text><rect x="60" y="340" width="420" height="100" rx="9" fill="#261f3d" stroke="#a98bf0" stroke-width="2"/><text x="270.0" y="375.65" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">validate_model (budget: 10 calls)</text><text x="270.0" y="395.975" font-size="14" fill="#a3b1c2" text-anchor="middle">Runs the full chain; returns the stage and diagnostics</text><text x="270.0" y="416.27500000000003" font-size="14" fill="#a3b1c2" text-anchor="middle">compile → checks → mg5 → pass</text><polygon points="270,466 352,500 270,534 188,500" fill="#1d2530" stroke="#4a5668" stroke-width="2"/><text x="270" y="505.25" font-size="15" fill="#e6ebf1" text-anchor="middle" font-weight="700">Pass?</text><rect x="60" y="565" width="420" height="70" rx="9" fill="#261f3d" stroke="#a98bf0" stroke-width="2"/><text x="270.0" y="595.8" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">review_model (budget: 2 calls)</text><text x="270.0" y="616.1249999999999" font-size="14" fill="#a3b1c2" text-anchor="middle">A fresh agent checks the model against the paper</text><rect x="60" y="665" width="420" height="50" rx="9" fill="#16283a" stroke="#5aa9e6" stroke-width="2"/><text x="270.0" y="695.95" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">The agent tries to stop</text><rect x="60" y="745" width="420" height="150" rx="9" fill="#3a3016" stroke="#e7b84b" stroke-width="2"/><text x="76" y="785.35" font-size="17" fill="#e6ebf1" text-anchor="start" font-weight="700">Stop gate (a Stop hook)</text><text x="76" y="805.675" font-size="14" fill="#a3b1c2" text-anchor="start">1. model.fr exists</text><text x="76" y="825.9749999999999" font-size="14" fill="#a3b1c2" text-anchor="start">2. validate_model has run</text><text x="76" y="846.2749999999999" font-size="14" fill="#a3b1c2" text-anchor="start">3. the last validation passed</text><text x="76" y="866.5749999999998" font-size="14" fill="#a3b1c2" text-anchor="start">4. model.fr has not changed since then</text><rect x="60" y="940" width="420" height="56" rx="9" fill="#1d3e2d" stroke="#4fc48a" stroke-width="2"/><text x="270.0" y="973.95" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">End: deliver model.fr</text><path d="M270,132 L270,160" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M270,222 L270,250" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M270,312 L270,340" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M270,440 L270,466" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M270,635 L270,665" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M270,715 L270,745" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M270,534 L270,565" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="274.66" y="538.525" width="34.68" height="21.6" rx="4" fill="#0f1318"/><text x="292" y="554.0500000000001" font-size="13.5" fill="#e6ebf1" text-anchor="middle">Yes</text><path d="M270,895 L270,940" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="214.86" y="905.525" width="110.28" height="21.6" rx="4" fill="#0f1318"/><text x="270" y="921.0500000000001" font-size="13.5" fill="#e6ebf1" text-anchor="middle">all four hold</text><rect x="650" y="160" width="460" height="62" rx="9" fill="#261f3d" stroke="#a98bf0" stroke-width="2" stroke-dasharray="6 5"/><text x="880.0" y="186.8" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">massbasis (when scalars mix)</text><text x="880.0" y="207.12500000000003" font-size="14" fill="#a3b1c2" text-anchor="middle">sympy derives the mass basis, about 1 s</text><path d="M650,191 L480,191" fill="none" stroke="#8a97a8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="650" y="440" width="460" height="120" rx="9" fill="#16283a" stroke="#5aa9e6" stroke-width="2"/><text x="880.0" y="476.5875" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">Read the report, fix model.fr</text><text x="880.0" y="496.36875" font-size="13.5" fill="#a3b1c2" text-anchor="middle">Report: stage reached, each check&#x27;s verdict,</text><text x="880.0" y="515.94375" font-size="13.5" fill="#a3b1c2" text-anchor="middle">non-Hermitian vertices, mass matrix, MG5 trace</text><text x="880.0" y="535.5187500000001" font-size="13.5" fill="#a3b1c2" text-anchor="middle">Shell: read its own UFO and logs, run wolframscript</text><path d="M352,500 L650,500" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="486.44" y="488.525" width="27.12" height="21.6" rx="4" fill="#0f1318"/><text x="500" y="504.05" font-size="13.5" fill="#e6ebf1" text-anchor="middle">No</text><path d="M880,440 L880,281 L480,281" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="787.06" y="348.525" width="185.88000000000002" height="21.6" rx="4" fill="#0f1318"/><text x="880" y="364.05" font-size="13.5" fill="#e6ebf1" text-anchor="middle">lint and validate again</text><path d="M480,600 L770,600 L770,560" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="530.84" y="588.525" width="178.32000000000002" height="21.6" rx="4" fill="#0f1318"/><text x="620" y="604.0500000000001" font-size="13.5" fill="#e6ebf1" text-anchor="middle">a physics change found</text><path d="M480,820 L690,820" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="514.74" y="808.525" width="140.52" height="21.6" rx="4" fill="#0f1318"/><text x="585" y="824.0500000000001" font-size="13.5" fill="#e6ebf1" text-anchor="middle">one does not hold</text><polygon points="880,758 1070,820 880,882 690,820" fill="#3a3016" stroke="#e7b84b" stroke-width="2"/><text x="880" y="815.2875" font-size="14.5" fill="#e6ebf1" text-anchor="middle" font-weight="700">Blocked fewer than 3 times</text><text x="880" y="834.8625000000001" font-size="14.5" fill="#e6ebf1" text-anchor="middle" font-weight="700">and fewer than 10 validations?</text><path d="M1070,820 L1210,820 L1210,500 L1110,500" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="1199.2" y="521.7" width="21.6" height="276.6" rx="4" fill="#0f1318"/><text x="1210" y="664.725" font-size="13.5" fill="#e6ebf1" text-anchor="middle" transform="rotate(-90 1210 664.725)">Yes: send back with a report digest</text><rect x="650" y="940" width="460" height="56" rx="9" fill="#4a2423" stroke="#e5645f" stroke-width="2"/><text x="880.0" y="973.95" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">Allow: end with a failing model</text><path d="M880,882 L880,940" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="888.44" y="898.525" width="27.12" height="21.6" rx="4" fill="#0f1318"/><text x="902" y="914.0500000000001" font-size="13.5" fill="#e6ebf1" text-anchor="middle">No</text><text x="880" y="1022" font-size="13.5" fill="#a3b1c2" text-anchor="middle">All 5 zero scores of the Haiku tools group ended here.</text><text x="60" y="1022" font-size="13.5" fill="#a3b1c2" text-anchor="start">The whole loop has a 4-hour limit.</text></svg>
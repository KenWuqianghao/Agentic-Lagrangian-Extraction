<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 470" width="1300" height="470" font-family='"Noto Sans","Segoe UI",Helvetica,Arial,sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a97a8"/></marker></defs><rect width="1300" height="470" fill="#0f1318"/><text x="40" y="40" font-size="22" fill="#e6ebf1" text-anchor="start" font-weight="700">Vanilla: the agent&#x27;s work loop</text><rect x="40" y="120" width="230" height="80" rx="9" fill="#3a2618" stroke="#e0864a" stroke-width="2"/><text x="155.0" y="155.8" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">Read the paper</text><text x="155.0" y="176.12500000000003" font-size="14" fill="#a3b1c2" text-anchor="middle">and SM.fr</text><rect x="310" y="120" width="230" height="80" rx="9" fill="#3a2618" stroke="#e0864a" stroke-width="2"/><text x="425.0" y="155.8" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">Write model.fr</text><text x="425.0" y="176.12500000000003" font-size="14" fill="#a3b1c2" text-anchor="middle">its own way</text><rect x="580" y="110" width="330" height="100" rx="9" fill="#3a2618" stroke="#e0864a" stroke-width="2"/><text x="745.0" y="145.65" font-size="17" fill="#e6ebf1" text-anchor="middle" font-weight="700">Run its own checks</text><text x="745.0" y="165.97500000000002" font-size="14" fill="#a3b1c2" text-anchor="middle">Writes its own wolframscript</text><text x="745.0" y="186.27500000000003" font-size="14" fill="#a3b1c2" text-anchor="middle">for the FeynRules checks; sometimes MG5</text><polygon points="1085,108 1220,160 1085,212 950,160" fill="#3a2618" stroke="#e0864a" stroke-width="2"/><text x="1085" y="155.125" font-size="15" fill="#e6ebf1" text-anchor="middle" font-weight="700">It thinks</text><text x="1085" y="175.375" font-size="15" fill="#e6ebf1" text-anchor="middle" font-weight="700">it passes?</text><path d="M270,160 L310,160" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M540,160 L580,160" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M910,160 L950,160" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><path d="M1085,108 L1085,80 L425,80 L425,120" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="684.74" y="68.525" width="140.52" height="21.6" rx="4" fill="#0f1318"/><text x="755" y="84.05" font-size="13.5" fill="#e6ebf1" text-anchor="middle">No: fix it itself</text><rect x="985" y="250" width="200" height="56" rx="9" fill="#1d2530" stroke="#4a5668" stroke-width="2"/><text x="1085.0" y="283.25" font-size="15" fill="#e6ebf1" text-anchor="middle" font-weight="700">End: deliver model.fr</text><path d="M1085,212 L1085,250" fill="none" stroke="#8a97a8" stroke-width="2" marker-end="url(#ah)"/><rect x="1089.66" y="219.525" width="34.68" height="21.6" rx="4" fill="#0f1318"/><text x="1107" y="235.04999999999998" font-size="13.5" fill="#e6ebf1" text-anchor="middle">Yes</text><rect x="40" y="250" width="870" height="190" rx="9" fill="#1d2530" stroke="#4a5668" stroke-width="2"/><text x="56" y="299.85" font-size="16" fill="#e6ebf1" text-anchor="start" font-weight="700">The differences from the tools group</text><text x="56" y="319.87500000000006" font-size="14" fill="#a3b1c2" text-anchor="start">• No lint, no diagnostic report, no massbasis, no referee agent.</text><text x="56" y="340.17500000000007" font-size="14" fill="#a3b1c2" text-anchor="start">• No stop gate: the agent itself decides if the model passes.</text><text x="56" y="360.4750000000001" font-size="14" fill="#a3b1c2" text-anchor="start">• It can be wrong: in Wprime s2 (Sonnet 5) its summary says &quot;all checks pass&quot;,</text><text x="56" y="380.7750000000001" font-size="14" fill="#a3b1c2" text-anchor="start">  but the scorer&#x27;s mass-spectrum check fails, so the score is 0.</text><text x="56" y="401.0750000000001" font-size="14" fill="#a3b1c2" text-anchor="start">• It reads long logs and works by trial, so it costs 2.7 to 3.8 times more.</text></svg>
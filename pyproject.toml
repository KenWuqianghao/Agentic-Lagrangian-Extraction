[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lagrangian-extraction"
version = "0.1.0"
description = "Stage 1 literature search pipeline for HEPSIM5 Lagrangian extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "tenacity>=8",
    "typer>=0.12",
    "pymupdf>=1.24",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
lag-extract = "lagrangian_extraction.cli:app"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["lagrangian_extraction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
